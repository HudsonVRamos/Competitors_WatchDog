[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "price-watchdog"
version = "0.1.0"
description = "Sistema de monitoramento automatizado de preços de concorrentes"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "playwright>=1.40",
    "boto3>=1.34",
    "aioboto3>=12.0",
    "openpyxl>=3.1",
    "apscheduler>=3.10",
    "tenacity>=8.2",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.90",
    "moto[sqs,s3,ses]>=5.0",
    "testcontainers>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
markers = [
    "property: property-based tests (Hypothesis)",
    "unit: unit tests",
    "integration: integration tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/price_watchdog", "src/scraping_resilience"]
