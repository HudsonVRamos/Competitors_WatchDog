# Configuração do Alembic para Price Watchdog

[alembic]
# Diretório de scripts de migration
script_location = alembic

# Template para novos arquivos de migration
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Prepend sys.path para resolução de módulos
prepend_sys_path = src

# Timezone para timestamps nas migrations
timezone = UTC

# URL de conexão (será sobrescrita pelo env.py via settings)
sqlalchemy.url = postgresql+asyncpg://localhost/price_watchdog

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
